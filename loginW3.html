<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 850px;
            background-color: #fff;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .image-section {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1519046904884-53103b34b206?q=80&w=1170&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .image-section p {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-style: italic;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 4px;
        }

        .form-section {
            flex: 1;
            padding: 40px;
        }

        .form-section h2 {
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        .input-icon {
            position: relative;
            margin-bottom: 15px;
        }

        .input-icon i {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #666;
        }

        .input-icon input {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        .form-section select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }

        .form-section button {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: black;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-section button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="image-section">
        <p># BEACH 2018</p>
    </div>
    <div class="form-section">
        <h2>REGISTRATION FORM</h2>
        <div class="form-group">
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
        </div>

        <div class="input-icon">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="Username">
        </div>

        <div class="input-icon">
            <i class="fa fa-envelope"></i>
            <input type="email" placeholder="Email Address">
        </div>

        <select>
            <option value="">Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <div class="input-icon">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Password">
        </div>

        <div class="input-icon">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Confirm Password">
        </div>

        <button type="submit">Register →</button>
    </div>
</div>

</body>
</html>
